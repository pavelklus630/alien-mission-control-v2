[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mission-control"
version = "2.3.0"
description = "ALIEN RPG GM toolkit — Mission Control v2 (Soundboard, MU/TH/UR Terminal, Vibe, Erebos Map)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mission_control" = ["services/**/templates/*", "services/**/static/**/*", "services/**/scenes/**/*", "shared_static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "slow: deselected from the fast pre-launch gate",
]

[tool.ruff]
line-length = 100
target-version = "py311"
