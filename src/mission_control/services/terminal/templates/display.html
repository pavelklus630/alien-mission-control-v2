  :root {
    --g:     #00e84a;
    --g-dim: #007a28;
    --g-hi:  #80ffb0;
    --bg:    #020602;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width: 800px; height: 800px;
    background: var(--bg);
    color: var(--g);
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    overflow: hidden;
  }

  /* CRT vignette */
  body::before {
    content:''; position:fixed; inset:0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
    pointer-events:none; z-index:20;
  }

  /* Scanlines */
  body::after {
    content:''; position:fixed; inset:0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 5px
    );
    pointer-events:none; z-index:21;
    animation: flicker 11s infinite;
  }

  @keyframes flicker {
    0%,93%,96%,100% { opacity:1; }
    94%  { opacity:0.85; }
    95%  { opacity:0.97; }
  }

  /* Green phosphor ambient glow on the whole screen */
  #screen {
    width:800px; height:800px;
    display:flex; flex-direction:column;
    padding: 18px 26px 14px;
    box-shadow: inset 0 0 80px rgba(0,232,74,0.06);
    position:relative;
  }

  /* ── Header ── */
  #hdr {
    display:flex; justify-content:space-between; align-items:flex-start;
    border-bottom: 1px solid var(--g-dim);
    padding-bottom:7px; margin-bottom:10px; flex-shrink:0;
  }
  #hdr .corp  { font-size:10px; color:var(--g-dim); letter-spacing:4px; }
  #hdr .model {
    font-size:15px; color:var(--g-hi); letter-spacing:2px;
    text-shadow: 0 0 10px var(--g), 0 0 22px rgba(0,232,74,0.35);
  }
  #hdr-r { text-align:right; font-size:10px; color:var(--g-dim); line-height:1.7; }

  /* ── Log ── */
  #log {
    flex:1; overflow:hidden;
    display:flex; flex-direction:column; justify-content:flex-end;
  }

  /* Base line — 40 px, everything inherits unless overridden */
  .line {
    display:block;
    font-size: 40px;
    line-height: 1.28;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--g);
    flex-shrink: 0;
  }

  /* Size overrides */
  .sz-logo  { font-size:12px; line-height:1.15; color:var(--g);
               text-shadow: 0 0 4px var(--g); white-space: pre; }
  .sz-small { font-size:20px; line-height:1.3; }
  .sz-mid   { font-size:28px; line-height:1.3; }

  /* Type colours */
  .type-title     { color:var(--g-hi);
                    text-shadow: 0 0 14px var(--g), 0 0 30px rgba(0,232,74,0.45); }
  .type-subtitle  { color:var(--g-dim); }
  .type-divider   { color:var(--g-dim); }
  .type-system    { color:var(--g-dim); }
  .type-prompt    { color:var(--g); }
  .type-user      { color:var(--g-hi); text-shadow: 0 0 8px var(--g); }
  .type-user::before { content:'> '; color:var(--g-dim); }
  .type-warning   { color:#ff6600; text-shadow:0 0 14px #ff6600; }
  .type-error     { color:#ff2020; text-shadow:0 0 12px #ff2020; }
  .type-info      { color:#55aaff; }
  .type-success   { color:#33ff77; text-shadow:0 0 8px #33ff77; }
  .type-classified { color:var(--g-dim); letter-spacing:2px; }
  .type-classified::after {
    content:' [\u2588\u2588 CLASSIFIED \u2588\u2588]';
    color:#ff4400; font-size:0.55em; letter-spacing:1px;
    text-shadow:0 0 8px #ff4400;
  }

  /* Cursor — em-sized so it scales with parent font */
  #cursor {
    display:inline-block;
    width:0.55em; height:0.9em;
    background:var(--g);
    animation: blink 1.05s step-start infinite;
    vertical-align:middle;
    box-shadow: 0 0 10px var(--g);
    margin-left:1px;
  }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

  /* ── Footer ── */
  #ftr {
    border-top:1px solid var(--g-dim);
    margin-top:9px; padding-top:6px;
    display:flex; justify-content:space-between;
    font-size:10px; color:var(--g-dim); letter-spacing:2px; flex-shrink:0;
  }

  /* Screen-on flash overlay */
  #flash {
    position:fixed; inset:0;
    background:var(--g);
    opacity:0; pointer-events:none; z-index:30;
    transition: opacity 0.07s ease;
  }
</style>
</head>
<body>
<div id="flash"></div>
<div id="screen">

  <div id="hdr">
    <div>
      <div class="corp">WEYLAND-YUTANI CORPORATION</div>
      <div class="model">MU/TH/UR 6000</div>
    </div>
    <div id="hdr-r">
      <div>UNIT: WY-MU6-0047</div>
      <div>STATUS: <span style="color:var(--g-hi)">ONLINE</span></div>
      <div id="clk">--:--:--</div>
    </div>
  </div>

  <div id="log"></div>

  <div id="ftr">
    <span>USCSS NET  &#x25CF;  SECTOR 7-G</span>
    <span>ENC: AES-2048</span>
    <span>UPLINK: <span style="color:var(--g-hi)">ACTIVE</span></span>
  </div>

</div>
<script>
// ── Clock ───────────────────────────────────────────────────────────────────
const clkEl = document.getElementById('clk');
function tick() {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  clkEl.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
setInterval(tick, 1000); tick();

// ── Sounds ──────────────────────────────────────────────────────────────────
const SND = {};
['boot','beep','buzz','downshuffle','horn','loud_type_start',
 'printer1','printer2','rattle','screen_display','subtle_long_type','typing_long']
  .forEach(n => { SND[n] = new Audio(`/sounds/${n}.ogg`); });
SND.typing_long.loop    = true;
SND.subtle_long_type.loop = true;

function splay(n)  { try { SND[n].currentTime=0; SND[n].play().catch(()=>{}); } catch(e){} }
function sstop(n)  { try { SND[n].pause(); SND[n].currentTime=0; } catch(e){} }
function stopType(){ ['typing_long','subtle_long_type','loud_type_start'].forEach(sstop); }

// ── DOM helpers ──────────────────────────────────────────────────────────────
const logEl  = document.getElementById('log');
const MAX_LINES = 60;

function mkLine(type, sz) {
  while (logEl.children.length >= MAX_LINES) logEl.removeChild(logEl.firstChild);
  const el = document.createElement('span');
  el.className = `line type-${type}` + (sz ? ' '+sz : '');
  logEl.appendChild(el);
  return el;
}
function putCursor(el) {
  const old = document.getElementById('cursor');
  if (old) old.remove();
  if (!el) return;
  const c = document.createElement('span'); c.id='cursor';
  el.appendChild(c);
}

// ── Typing engine ────────────────────────────────────────────────────────────
let Q=[], busy=false;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function enq(item) { Q.push(item); if (!busy) pump(); }
function pump() {
  if (!Q.length) { busy=false; return; }
  busy=true;
  const item = Q.shift();
  doLine(item).then(() => setTimeout(pump, item.after ?? 220));
}

async function doLine({text, type, sz, cd=65, instant=false}) {
  const el = mkLine(type, sz);
  putCursor(el);
  if (instant || !text) { el.textContent = text||''; putCursor(el); return; }

  stopType();

  if      (type==='warning')   { splay('horn');     await sleep(380); }
  else if (type==='error')     { splay('buzz');     await sleep(300); }
  else if (type==='classified'){ splay('printer2'); await sleep(120); }
  else if (sz==='sz-logo')     { /* silent fast print */ }
  else if (type==='system')    { splay('screen_display'); await sleep(70);
                                  splay('subtle_long_type'); }
  else                         { splay('screen_display'); await sleep(50);
                                  splay('loud_type_start'); await sleep(55);
                                  splay('typing_long'); }

  await new Promise(res => {
    let i=0;
    const t = setInterval(() => {
      el.textContent = text.slice(0, ++i);
      putCursor(el);
      if (i >= text.length) {
        clearInterval(t); stopType();
        if (type==='system' && text.includes('OK'))
          setTimeout(() => splay('beep'), 50);
        res();
      }
    }, cd);
  });
}

// ── Boot sequence ────────────────────────────────────────────────────────────
const LOGO = [

async function runBoot() {
  const fl = document.getElementById('flash');
  fl.style.opacity = '0.3';
  splay('boot');
  await sleep(100); fl.style.opacity='0';
  await sleep(500); splay('rattle');
  await sleep(380); splay('screen_display');
  await sleep(200);
  BOOT.forEach(item => enq(item));
  // When queue drains, start server polling
  const chk = setInterval(() => {
    if (!busy && !Q.length) { clearInterval(chk); startPoll(); }
  }, 300);
}

// ── Server polling ───────────────────────────────────────────────────────────
let known = 0;
function startPoll() {
  fetch('/poll?since=0').then(r=>r.json())
    .then(d => { known = d.total||0; })
    .catch(()=>{});
  setInterval(doPoll, 900);
}

const CHAR_DELAYS = {warning:80, error:90, classified:70, system:40, divider:0};

async function doPoll() {
  try {
    const d = await (await fetch(`/poll?since=${known}`)).json();
    if (d.messages && d.messages.length) {
      d.messages.forEach(m => enq({
        text: m.text,
        type: m.type || 'user',
        cd:   CHAR_DELAYS[m.type] ?? 65,
        after: 260
      }));
      known = d.total;
    }
  } catch(e) {}
}

runBoot();
