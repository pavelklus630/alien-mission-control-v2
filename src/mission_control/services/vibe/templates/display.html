<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>VIBE</title>
<style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
</style>
</head>
<body><canvas id="c"></canvas>
<script>
'use strict';

const BUILTIN_IDS = [
  'crimson_vortex','solar_approach','the_hive','deep_transit',
  'hypersleep','ichor_flow','the_nest','derelict',
  'singularity','neural_map','motion_tracker','blood_orbit'
];

// ── State ─────────────────────────────────────────────────────────────
let activeScene = null;
let pendingSceneId = null;
let txState = 'idle'; // 'idle' | 'fade_out' | 'fade_in'
let fadeAlpha = 0;
const FADE_SPEED = 0.04;
const particleState = new Map();
const motionFnCache = new Map();
const assetImages = {};
const startTime = performance.now();

// ── Canvas ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 1920, H = 1080;

function resize() {
  W = canvas.width = window.innerWidth || 1920;
  H = canvas.height = window.innerHeight || 1080;
  particleState.clear();
}
window.addEventListener('resize', resize);
resize();

// ── Helpers ───────────────────────────────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * t; }

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return {r, g, b};
}

function rgba(hex, a) {
  const {r, g, b} = hexToRgb(hex || '#000000');
  return `rgba(${r},${g},${b},${a})`;
}

// ── Motion evaluator ──────────────────────────────────────────────────
function evalMotion(expr, t, W, H) {
  if (!motionFnCache.has(expr)) {
    const safe = expr
      .replace(/\bsin\b/g, 'Math.sin').replace(/\bcos\b/g, 'Math.cos')
      .replace(/\btan\b/g, 'Math.tan').replace(/\babs\b/g, 'Math.abs')
      .replace(/\bfloor\b/g, 'Math.floor').replace(/\bceil\b/g, 'Math.ceil')
      .replace(/\bsqrt\b/g, 'Math.sqrt').replace(/\bpow\b/g, 'Math.pow')
      .replace(/\bmax\b/g, 'Math.max').replace(/\bmin\b/g, 'Math.min')
      .replace(/\bTAU\b/g, '(Math.PI*2)').replace(/\bPI\b/g, 'Math.PI');
    let fn;
    try { fn = new Function('t','W','H', `"use strict";try{return(${safe});}catch(e){return 0;}`); }
    catch(_) { fn = () => 0; }
    motionFnCache.set(expr, fn);
  }
  try { return motionFnCache.get(expr)(t, W, H); } catch(_) { return 0; }
}

function resolveMotion(layer, t, W, H) {
  const p = Object.assign({}, layer.params);
  if (layer.motion) {
    for (const [k, expr] of Object.entries(layer.motion)) {
      if (typeof expr === 'string') {
        const v = evalMotion(expr, t, W, H);
        if (v !== null && !isNaN(v)) p[k] = v;
      }
    }
  }
  return p;
}

// ── Layer renderers ───────────────────────────────────────────────────
function renderSolidBg(ctx, W, H, p) {
  ctx.fillStyle = p.color || '#000';
  ctx.fillRect(0, 0, W, H);
}

function renderGradientBg(ctx, W, H, p) {
  const type = p.type || 'radial';
  const stops = p.stops || [{pos:0,color:'#000'},{pos:1,color:'#111'}];
  let grad;
  if (type === 'linear') {
    const angle = (p.angle || 0) * Math.PI / 180;
    const dx = Math.cos(angle), dy = Math.sin(angle), mag = Math.max(W, H);
    const cx = W/2, cy = H/2;
    grad = ctx.createLinearGradient(cx-dx*mag, cy-dy*mag, cx+dx*mag, cy+dy*mag);
  } else {
    const cx = (p.cx ?? 0.5) * W, cy = (p.cy ?? 0.5) * H;
    const r = Math.sqrt(Math.max(cx*cx+cy*cy, (W-cx)*(W-cx)+cy*cy, cx*cx+(H-cy)*(H-cy), (W-cx)*(W-cx)+(H-cy)*(H-cy)));
    grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  }
  for (const s of stops) grad.addColorStop(Math.max(0, Math.min(1, s.pos)), s.color);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function renderVignette(ctx, W, H, p) {
  const type = p.type || 'radial';
  const strength = p.strength ?? 0.8;
  const color = p.color || '#000000';
  if (type === 'radial') {
    const cx = W/2, cy = H/2, r = Math.sqrt(cx*cx + cy*cy) * 1.1;
    const grad = ctx.createRadialGradient(cx, cy, r*0.1, cx, cy, r);
    grad.addColorStop(0, rgba(color, 0));
    grad.addColorStop(0.5, rgba(color, strength * 0.4));
    grad.addColorStop(1, rgba(color, strength));
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  } else {
    const dir = p.direction || 'bottom';
    let x0, y0, x1, y1;
    if (dir === 'bottom') { x0=0;y0=0;x1=0;y1=H; }
    else if (dir === 'top') { x0=0;y0=H;x1=0;y1=0; }
    else if (dir === 'right') { x0=0;y0=0;x1=W;y1=0; }
    else { x0=W;y0=0;x1=0;y1=0; }
    const grad = ctx.createLinearGradient(x0, y0, x1, y1);
    grad.addColorStop(0, rgba(color, 0));
    grad.addColorStop(1 - strength*0.4, rgba(color, 0));
    grad.addColorStop(1, rgba(color, strength));
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  }
}

function initParticles(layer, W, H) {
  const p = layer.params;
  const count = p.count || 80;
  const arr = [];
  for (let i = 0; i < count; i++) {
    const speed = p.speed || 0;
    const angle = Math.random() * Math.PI * 2;
    arr.push({
      x: Math.random()*W, y: Math.random()*H,
      vx: Math.cos(angle)*speed*(0.5+Math.random()),
      vy: Math.sin(angle)*speed*(0.5+Math.random()),
      size: lerp(p.size_min ?? 1, p.size_max ?? 3, Math.random()),
      hue:  lerp(p.hue_min ?? 0, p.hue_max ?? 360, Math.random()),
      alpha: lerp(p.alpha_min ?? 0.3, p.alpha_max ?? 0.9, Math.random()),
      phase: Math.random() * Math.PI * 2,
    });
  }
  return arr;
}

function renderParticleField(ctx, W, H, layer, t) {
  const p = layer.params;
  if (!particleState.has(layer.id)) particleState.set(layer.id, initParticles(layer, W, H));
  const particles = particleState.get(layer.id);
  for (const pt of particles) {
    pt.x += pt.vx; pt.y += pt.vy;
    if (pt.x < 0) pt.x += W; if (pt.x > W) pt.x -= W;
    if (pt.y < 0) pt.y += H; if (pt.y > H) pt.y -= H;
    const a = pt.alpha * (0.5 + 0.5 * Math.sin(t * 0.001 + pt.phase));
    ctx.fillStyle = `hsla(${pt.hue},70%,70%,${a})`;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * 0.5, 0, Math.PI * 2); ctx.fill();
  }
}

function renderVortex(ctx, W, H, p, t) {
  const cx = (p.cx ?? 0.5) * W, cy = (p.cy ?? 0.5) * H;
  const layerCount = Math.max(1, p.layer_count ?? 5);
  const hueStart = p.hue_start ?? 0, hueEnd = p.hue_end ?? 60;
  const tilt = p.tilt ?? 0, rotSpeed = p.rotation_speed ?? 0.0001;
  const baseAlpha = p.base_alpha ?? 0.65;
  const MR = Math.min(W, H) * 0.48;
  const angle = t * rotSpeed;
  for (let i = 0; i < layerCount; i++) {
    const frac = i / Math.max(1, layerCount - 1);
    const hue = hueStart + (hueEnd - hueStart) * frac;
    const armAngle = angle + frac * Math.PI * 2;
    const scl = 0.35 + frac * 0.65;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(armAngle + tilt);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, MR * scl);
    grad.addColorStop(0, `hsla(${hue},100%,65%,${baseAlpha})`);
    grad.addColorStop(0.4, `hsla(${hue},80%,42%,${baseAlpha * 0.55})`);
    grad.addColorStop(1, `hsla(${hue},60%,18%,0)`);
    ctx.scale(1, 0.32);
    ctx.beginPath(); ctx.arc(0, 0, MR * scl, 0, Math.PI * 2);
    ctx.fillStyle = grad; ctx.fill();
    ctx.restore();
  }
}

function initWisps(layer, W, H) {
  const p = layer.params;
  const count = p.count ?? 10;
  const arr = [];
  for (let i = 0; i < count; i++) {
    arr.push({
      x: Math.random() * W, y: Math.random() * H,
      r: lerp(p.size_min ?? 60, p.size_max ?? 300, Math.random()),
      hue: lerp(p.hue_min ?? 0, p.hue_max ?? 360, Math.random()),
      alpha: lerp(p.alpha_min ?? 0.01, p.alpha_max ?? 0.05, Math.random()),
      dx: (Math.random() - 0.5) * (p.drift_speed ?? 0.0001) * 50,
      dy: (Math.random() - 0.5) * (p.drift_speed ?? 0.0001) * 50,
      phase: Math.random() * Math.PI * 2,
    });
  }
  return arr;
}

function renderNebula(ctx, W, H, layer, t) {
  if (!particleState.has(layer.id)) particleState.set(layer.id, initWisps(layer, W, H));
  const wisps = particleState.get(layer.id);
  for (const w of wisps) {
    w.x += w.dx; w.y += w.dy;
    if (w.x < -w.r) w.x = W+w.r; if (w.x > W+w.r) w.x = -w.r;
    if (w.y < -w.r) w.y = H+w.r; if (w.y > H+w.r) w.y = -w.r;
    const a = w.alpha * (0.7 + 0.3 * Math.sin(t * 0.0005 + w.phase));
    const grad = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.r);
    grad.addColorStop(0, `hsla(${w.hue},60%,40%,${a})`);
    grad.addColorStop(1, `hsla(${w.hue},40%,15%,0)`);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.fill();
  }
}

function renderPathFlow(ctx, W, H, layer, t) {
  const p = layer.params;
  const rawPaths = p.paths || [];
  const color = p.color || '#8b0000';
  const lineWidth = p.line_width || 1.2;
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lineWidth;
  ctx.shadowColor = color; ctx.shadowBlur = 5; ctx.globalAlpha = 0.55;
  for (const rawPath of rawPaths) {
    const pts = rawPath.map(([nx, ny]) => [nx * W, ny * H]);
    if (pts.length < 2) continue;
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i+1][0]) / 2;
      const my = (pts[i][1] + pts[i+1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    ctx.lineTo(pts[pts.length-1][0], pts[pts.length-1][1]); ctx.stroke();
  }
  const speedMin = p.speed_min ?? 0.0006, speedMax = p.speed_max ?? 0.0018;
  const hueMin = p.hue_min ?? 340, hueMax = p.hue_max ?? 362;
  const particleCount = p.particle_count ?? 30;
  if (!particleState.has(layer.id)) {
    const fp = [];
    for (let i = 0; i < particleCount; i++) {
      const pi = Math.floor(Math.random() * rawPaths.length);
      fp.push({ pathIdx: pi, pos: Math.random(), speed: lerp(speedMin, speedMax, Math.random()), hue: lerp(hueMin, hueMax, Math.random()) });
    }
    particleState.set(layer.id, fp);
  }
  const flowParticles = particleState.get(layer.id);
  ctx.shadowBlur = 8;
  for (const fp of flowParticles) {
    fp.pos += fp.speed;
    if (fp.pos >= 1) { fp.pos = 0; fp.pathIdx = Math.floor(Math.random() * rawPaths.length); }
    const rawPath = rawPaths[fp.pathIdx]; if (!rawPath) continue;
    const segF = fp.pos * (rawPath.length - 1);
    const seg = Math.floor(segF), segT = segF - seg;
    const a = rawPath[Math.min(seg, rawPath.length-1)];
    const b = rawPath[Math.min(seg+1, rawPath.length-1)];
    const x = lerp(a[0], b[0], segT) * W, y = lerp(a[1], b[1], segT) * H;
    const alpha = 0.6 + 0.4 * Math.sin(fp.pos * Math.PI);
    const grad = ctx.createRadialGradient(x, y, 0, x, y, 5);
    grad.addColorStop(0, `hsla(${fp.hue},100%,70%,${alpha})`);
    grad.addColorStop(1, `hsla(${fp.hue},80%,40%,0)`);
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function renderGeometric(ctx, W, H, p, t) {
  const type = p.type || 'rings';
  const cx = W/2, cy = H/2;
  const MR = Math.min(W, H) * 0.42;
  const color = p.color || '#33dd55';
  const alpha = p.alpha ?? 0.2;
  ctx.save();
  switch (type) {
    case 'rings': {
      const count = p.ring_count ?? 4;
      ctx.strokeStyle = color; ctx.lineWidth = 0.8; ctx.globalAlpha = alpha;
      for (let i = 1; i <= count; i++) {
        ctx.beginPath(); ctx.arc(cx, cy, MR * i / count, 0, Math.PI * 2); ctx.stroke();
      }
      break;
    }
    case 'crosshair': {
      ctx.strokeStyle = color; ctx.lineWidth = 0.5; ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.moveTo(0, cy); ctx.lineTo(W, cy);
      ctx.moveTo(cx, 0); ctx.lineTo(cx, H);
      ctx.stroke();
      break;
    }
    case 'bearing_ticks': {
      const tickCount = p.tick_count ?? 72;
      ctx.strokeStyle = color; ctx.lineWidth = 0.5; ctx.globalAlpha = alpha;
      const outerR = MR, innerR = MR * 0.925;
      for (let i = 0; i < tickCount; i++) {
        const a = (i / tickCount) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a)*outerR, cy + Math.sin(a)*outerR);
        ctx.lineTo(cx + Math.cos(a)*innerR, cy + Math.sin(a)*innerR);
        ctx.stroke();
      }
      break;
    }
    case 'radar_sweep': {
      const sweepAngle = p.sweep_angle ?? ((t * (p.sweep_speed ?? 0.012)) % (Math.PI * 2));
      const trailSegs = Math.max(1, p.trail_segments ?? 20);
      const trailSpan = (p.trail_span ?? 0.95) * Math.PI * 2;
      for (let i = trailSegs; i >= 0; i--) {
        const frac = i / trailSegs;
        const segAngle = sweepAngle - frac * trailSpan;
        ctx.globalAlpha = (1 - frac) * 0.18;
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, MR, segAngle - trailSpan/trailSegs, segAngle);
        ctx.closePath(); ctx.fillStyle = color; ctx.fill();
      }
      ctx.globalAlpha = 0.85; ctx.strokeStyle = color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(sweepAngle)*MR, cy + Math.sin(sweepAngle)*MR);
      ctx.stroke();
      break;
    }
  }
  ctx.restore();
}

function renderImage(ctx, W, H, p) {
  const src = p.src || p.asset;
  if (!src || !assetImages[src] || !assetImages[src].complete) return;
  const img = assetImages[src];
  const fit = p.fit || 'contain', scale = p.scale || 1;
  const cx = (p.cx ?? 0.5) * W, cy = (p.cy ?? 0.5) * H;
  let dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
  if (fit === 'cover' || fit === 'contain') {
    const scaleX = W / img.naturalWidth, scaleY = H / img.naturalHeight;
    const s = fit === 'cover' ? Math.max(scaleX, scaleY) : Math.min(scaleX, scaleY);
    dw = img.naturalWidth * s * scale; dh = img.naturalHeight * s * scale;
  }
  ctx.drawImage(img, cx - dw/2, cy - dh/2, dw, dh);
}

function renderSprite(ctx, W, H, layer, p, t) {
  const src = p.src || p.asset;
  if (!src || !assetImages[src] || !assetImages[src].complete) return;
  const img = assetImages[src];
  const cx = (p.cx ?? 0.5) * W, cy = (p.cy ?? 0.5) * H;
  const sf = p.size_factor ?? 0.1;
  const maxSz = sf * Math.min(W, H);
  const aspect = img.naturalWidth / img.naturalHeight;
  const dw = aspect >= 1 ? maxSz : maxSz * aspect;
  const dh = aspect >= 1 ? maxSz / aspect : maxSz;
  const rotation = p.rotation ?? 0;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(rotation);
  ctx.drawImage(img, -dw/2, -dh/2, dw, dh);
  ctx.restore();
}

// Generic fallback for 'custom' layers — renders based on common param patterns.
// Covers: cross-ship (size_factor), ellipse (rx/ry), planet disc (radius_factor),
// scattered blips (count), arbitrary glow (color).
function renderCustom(ctx, W, H, layer, p) {
  const cx = ((p.cx_base ?? p.cx ?? 0.5) * W) + (p.x_offset ?? 0);
  const cy = ((p.cy_base ?? p.cy ?? 0.5) * H) + (p.y_offset ?? 0);
  ctx.save();

  if (p.size_factor !== undefined) {
    // Cross-shaped ship silhouette (size_factor + optional rotation/y_offset)
    const sz = p.size_factor * Math.min(W, H);
    const rot = p.rotation ?? 0;
    ctx.translate(cx, cy); ctx.rotate(rot);
    ctx.fillStyle = 'rgba(5,2,0,0.96)';
    ctx.fillRect(-sz*0.07, -sz*0.46, sz*0.14, sz*0.92);
    ctx.fillRect(-sz*0.38, -sz*0.065, sz*0.76, sz*0.13);
    ctx.fillRect(-sz*0.055, -sz*0.50, sz*0.11, sz*0.09);
    ctx.fillRect(-sz*0.055,  sz*0.41, sz*0.11, sz*0.09);
    ctx.fillRect(-sz*0.42,  -sz*0.04, sz*0.06, sz*0.08);
    ctx.fillRect( sz*0.36,  -sz*0.04, sz*0.06, sz*0.08);

  } else if (p.rx !== undefined || p.ry !== undefined) {
    // Ellipse — ship hull, plasma blob, etc.
    const rx = p.rx ?? p.ry ?? 30;
    const ry = p.ry ?? rx;
    const rot = p.rotation ?? 0;
    ctx.shadowColor = 'rgba(160,120,80,0.4)'; ctx.shadowBlur = 15;
    ctx.fillStyle = 'rgba(8,4,2,0.95)';
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); ctx.fill();

  } else if (p.radius_factor !== undefined || p.outer_r !== undefined) {
    // Planet disc / event horizon disc
    const r = (p.radius_factor ?? (p.outer_r ?? 0.25)) * Math.min(W, H);
    const lx = cx + (p.light_offset_x ?? 0.05) * W;
    const ly = cy + (p.light_offset_y ?? -0.05) * H;
    const grad = ctx.createRadialGradient(lx, ly, 0, cx, cy, r);
    grad.addColorStop(0,   'rgba(100,65,40,0.95)');
    grad.addColorStop(0.6, 'rgba(55,35,20,0.9)');
    grad.addColorStop(1,   'rgba(10,5,3,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

  } else if (p.count !== undefined) {
    // Scattered blips / particles (radar contacts, nodes, etc.)
    const key = layer.id + '_c';
    if (!particleState.has(key)) {
      const range = (p.radial_range ?? p.drift_range ?? 0.4) * Math.min(W, H);
      const pts = [];
      for (let i = 0; i < Math.min(p.count, 300); i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.sqrt(Math.random()) * range;
        pts.push({ x: cx + Math.cos(angle)*dist, y: cy + Math.sin(angle)*dist });
      }
      particleState.set(key, pts);
    }
    const pts = particleState.get(key);
    const color = p.color_inner || p.color || '#33ff66';
    const dr = p.dot_radius ?? p.glow_radius ?? 2;
    ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 10;
    for (const pt of pts) {
      ctx.beginPath(); ctx.arc(pt.x, pt.y, dr, 0, Math.PI * 2); ctx.fill();
    }

  } else if (p.color !== undefined) {
    // Fallback: draw a small glow at (cx, cy)
    const r = 40;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, p.color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();
}

function renderLayer(ctx, W, H, layer, t) {
  const p = resolveMotion(layer, t, W, H);
  switch (layer.type) {
    case 'solid_bg':      renderSolidBg(ctx, W, H, p); break;
    case 'gradient_bg':   renderGradientBg(ctx, W, H, p); break;
    case 'vignette':      renderVignette(ctx, W, H, p); break;
    case 'particle_field':renderParticleField(ctx, W, H, layer, t); break;
    case 'vortex':        renderVortex(ctx, W, H, p, t); break;
    case 'nebula_wisps':  renderNebula(ctx, W, H, layer, t); break;
    case 'path_flow':     renderPathFlow(ctx, W, H, layer, t); break;
    case 'geometric':     renderGeometric(ctx, W, H, p, t); break;
    case 'image':         renderImage(ctx, W, H, p); break;
    case 'sprite':        renderSprite(ctx, W, H, layer, p, t); break;
    default:              renderCustom(ctx, W, H, layer, p); break;
  }
}

// ── Animation loop ────────────────────────────────────────────────────
function frame(ts) {
  requestAnimationFrame(frame);
  const t = ts - startTime;
  ctx.clearRect(0, 0, W, H);

  if (activeScene) {
    for (const layer of activeScene.layers) {
      if (!layer.visible) continue;
      ctx.save();
      ctx.globalAlpha = layer.opacity ?? 1;
      ctx.globalCompositeOperation = layer.blend || 'source-over';
      renderLayer(ctx, W, H, layer, t);
      ctx.restore();
    }
  }

  // Crossfade via black overlay
  if (txState !== 'idle') {
    if (txState === 'fade_out') {
      fadeAlpha = Math.min(1, fadeAlpha + FADE_SPEED);
      if (fadeAlpha >= 1) {
        if (pendingSceneId) { loadScene(pendingSceneId); pendingSceneId = null; }
        txState = 'fade_in';
      }
    } else if (txState === 'fade_in') {
      fadeAlpha = Math.max(0, fadeAlpha - FADE_SPEED);
      if (fadeAlpha <= 0) txState = 'idle';
    }
    ctx.fillStyle = `rgba(0,0,0,${fadeAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }
}
requestAnimationFrame(frame);

// ── Scene loading ─────────────────────────────────────────────────────
async function loadScene(sceneId) {
  try {
    const r = await fetch(`/api/editor/scenes/${encodeURIComponent(sceneId)}`);
    if (!r.ok) return;
    const scene = await r.json();
    particleState.clear();
    motionFnCache.clear();
    activeScene = scene;
    preloadSceneAssets(scene);
  } catch(_) {}
}

function preloadSceneAssets(scene) {
  for (const layer of (scene.layers || [])) {
    const src = (layer.params || {}).src || (layer.params || {}).asset;
    if (src && !assetImages[src]) {
      const img = new Image();
      img.src = `/api/editor/assets/${encodeURIComponent(src)}`;
      assetImages[src] = img;
    }
  }
}

function transitionTo(sceneId) {
  if (activeScene && activeScene.id === sceneId && txState === 'idle') return;
  pendingSceneId = sceneId;
  if (txState === 'idle') { fadeAlpha = 0; txState = 'fade_out'; }
}

// ── SSE ───────────────────────────────────────────────────────────────
function startSSE() {
  const es = new EventSource('/api/events');
  es.onmessage = function(e) {
    try {
      const d = JSON.parse(e.data);
      if (d.scene_id) {
        transitionTo(d.scene_id);
      } else if (typeof d.scene === 'number' && d.scene >= 0 && BUILTIN_IDS[d.scene]) {
        transitionTo(BUILTIN_IDS[d.scene]);
      }
    } catch(_) {}
  };
  es.onerror = function() { es.close(); setTimeout(startSSE, 1000); };
}
startSSE();

// ── Init ──────────────────────────────────────────────────────────────
async function init() {
  // Preload all registered assets
  try {
    const r = await fetch('/api/editor/assets');
    if (r.ok) {
      const assets = await r.json();
      for (const a of assets) {
        if (!assetImages[a.filename]) {
          const img = new Image();
          img.src = `/api/editor/assets/${encodeURIComponent(a.filename)}`;
          assetImages[a.filename] = img;
        }
      }
    }
  } catch(_) {}

  // Load current scene from state
  try {
    const r = await fetch('/api/scene');
    if (!r.ok) return;
    const d = await r.json();
    let sceneId = null;
    if (d.scene_id) {
      sceneId = d.scene_id;
    } else if (typeof d.scene === 'number' && d.scene >= 0 && BUILTIN_IDS[d.scene]) {
      sceneId = BUILTIN_IDS[d.scene];
    }
    if (sceneId) await loadScene(sceneId);
  } catch(_) {}
}
init();
</script>
